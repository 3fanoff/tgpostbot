parent:
  start:
    new: "Hello! This is a Telegram posting bot"
    old: "Hi, {username}! Here you can manage your bots"
  button:
    add: "➕ Add your bot"
    list: "📚 Bot list"
    help: "ℹ️ Help"
    undo: "↩️ Cancel"
    choose.lang: "🌐 Change language"
  command:
    lang: "🌐 Choose another language"
    newbot: "Add your bot"
    list: "List of my bots"
    help: "Bot usage help"
  language:
    ru: "Russian (rus)"
    en: "English (eng)"
    applied: "Language set to: *{lang}*"
    applied.keyboard: "Menu language changed"
