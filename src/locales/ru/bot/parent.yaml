  old: "Привет, {username}! Здесь ты можешь управлять своими ботами"
button:
  add: "➕ Добавить своего бота"
  list: "📚 Список ботов"
  help: "ℹ️ Помощь"
  undo: "↩️ Отмена"
  choose.lang: "🌐 Сменить язык"
command:
  lang: "🌐 Выбрать другой язык"
  newbot: "Добавить свой бот"
