  applied.keyboard: "Изменен язык меню"
error:
  update: "Ошибка для update {update_id}:"
  400: "Не удалось обработать ваш запрос"
  403: "Бот заблокирован пользователем"
  429: "Слишком много запросов, попробуйте позже"
  default: "Произошла ошибка при обработке запроса"
add:
  send: "Отправьте токен своего бота следующим сообщением"
  exception: |
      Не смог получить данные по боту от Телеграм.
      Убедитесь что вы скопировали реально существующий токен и попробуйте еще раз
  error:
    orm:
      default: |
        Произошла ошибка при привязывании бота.
        Попробуйте отправить токен еще раз, если ошибка появится снова обратитесь в тех. поддержку
      bot: |
        Бот с таким токеном уже добавлен у Вас или у другого пользователя.
        Скопируйте <b>новый</b> токен и попробуйте отправить еще раз. 
        Если ошибка появится снова обратитесь в тех. поддержку
      bot_user: |
        Пользователь с таким id был добавлен ранее.
  is_user: Это пользователь а не бот! Попробуйте другой токен
  attach: "Отлично! Привязываю бот {username}..."
  success: "Бот @{username} успешно добавлен!"
  is_not_token: "Это не очень похоже на токен. Попробуйте ещё раз"
help:
  text: "<b>Текст-справка</b>\nНесколько абзацев"