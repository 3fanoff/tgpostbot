name: "Bot_environment"
services:
  server_node:
    container_name: "tgpostbot"
    build: ./
    ports:
      - "3002:3000"
    volumes:
      - type: bind
        source: ./
        target: /usr/src/app
      - node_modules:/usr/src/app/node_modules
    networks:
      - backend

  db:
    container_name: "postgres"
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USER}
      PGDATA: "/var/lib/postgresql/data/pgdata"
    expose:
      - ${DB_PORT}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT}:${DB_PORT}"
    command: -p ${DB_PORT}
    networks:
      - backend
      - database

  adminer:
    container_name: "postgres_adminer"
    image: adminer
    restart: always
    ports:
      - "8080:8080"
    networks:
      - database
volumes:
  db-data:
  node_modules:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./node_modules
networks:
  backend:
  database: